<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="settings.css"></head><body><main><div class="eyebrow">SETTINGS</div><h1>Make the helper fit your focus.</h1><section><label>Anger level<select id="anger"><option value="mild">Mild</option><option value="angry">Angry</option><option value="nuclear">Nuclear</option></select></label><label class="check"><input id="audio-enabled" type="checkbox"> Angry audio</label><label>Volume<input id="volume" type="range" min="0" max="1" step=".05"></label><label>Intervene<select id="intervention"><option value="every">on every new tab</option><option value="first">after the first new tab</option></select></label><label>Grace period (seconds)<input id="grace" type="number" min="0" max="60"></label></section><section><h2>Whitelist</h2><p class="hint">Exact domains and their subdomains bypass interventions. No wildcards.</p><div class="add"><input id="domain" placeholder="wikipedia.org"><button id="add">Add</button></div><ul id="domains"></ul></section><p id="saved"></p></main><script type="module" src="settings.js"></script></body></html>
